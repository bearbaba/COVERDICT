name: Sepolia negative-receipt discovery
on:
  workflow_dispatch:
  push:
    branches:
      - test/negative-claims-acceptance
    paths:
      - 'scripts/inspect_sepolia_receipts.py'
      - '.github/workflows/sepolia-negative-receipt.yml'
permissions:
  contents: read
jobs:
  test-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find independent Sepolia API receipt for negative claim
        run: python scripts/inspect_sepolia_receipts.py
