name: COVERDICT quality gates
on:
  push:
  pull_request:
jobs:
  contract-shim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install genvm-linter
      - run: genvm-lint check contracts/Coverdict.py
      - run: genvm-lint check contracts/CoverdictV2.py
      - run: genvm-lint check contracts/CoverdictV2_2.py
      - run: python -m py_compile contracts/Coverdict.py
      - run: python -m py_compile contracts/CoverdictV2.py
      - run: python -m py_compile contracts/CoverdictV2_2.py
      - run: python -m pytest -q tests/
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
